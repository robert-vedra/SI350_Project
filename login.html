<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>

<!--old navbar because it is an html page still, changing to php caused issues-->
<body class="login-page">
  <nav class='navbar'>
  <ul class='nav-list'>
    <li><a href='index.php' class='nav-link'>Return to Home</a></li>
  </ul>
</nav>

  <div class="login-container">
    <h1>Login to Your Account</h1>

    <!--error message injected via JavaScript -->
    <div id="error-container"></div>

    <form method="post" action="login.php">
      <label for="username">Username (email):</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <input type="submit" value="Login">
      <input type="reset" value="Reset">
    </form>
  </div>

  <!-- the following detects error parameter in URL and displays error message -->
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("error") === "1") {
      document.getElementById("error-container").innerHTML = "<p class='error-message'>Error: Invalid username or password.</p>";
    }
  </script>
</body>
</html>
